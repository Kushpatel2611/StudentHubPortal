<main>

    <form data-api="api/feedback.php" id="feedback-form">

        <fieldset>

            <legend>Give Your Feedback</legend>

            <div class="form-grid">

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    minlength="2"
                    placeholder="Enter your name"
                    required>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

                <label for="rating">Rating</label>

                <select id="rating" name="rating" required>
                    <option value="">Select Rating</option>
                    <option value="5">Excellent</option>
                    <option value="4">Very Good</option>
                    <option value="3">Good</option>
                    <option value="2">Average</option>
                    <option value="1">Poor</option>
                </select>

                <label for="message">Feedback</label>

                <textarea
                    id="message"
                    name="message"
                    minlength="5"
                    placeholder="Write your feedback here..."
                    required></textarea>

                <input class="hp-field" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

                <input type="submit" value="Submit Feedback" class="btn">

                <p class="form-status" role="status" aria-live="polite"></p>

            </div>

        </fieldset>

    </form>

</main>
